name: Build 4MOVE unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned .app
        run: |
          xcodebuild \
            -project AIAssistant.xcodeproj \
            -scheme 4MOVE \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -archivePath "$RUNNER_TEMP/4MOVE.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive

      - name: Pack IPA
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/4MOVE.xcarchive/Products/Applications/4MOVE.app" Payload/
          zip -qry 4MOVE-unsigned.ipa Payload
          ls -lh 4MOVE-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 4MOVE-unsigned-ipa
          path: 4MOVE-unsigned.ipa
          retention-days: 14
